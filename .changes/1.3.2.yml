version: 1.3.2
is_breaking: false
under_the_hood:
- Adds the `_fivetran_synced` field to the documentation for the `stg_google_play__earnings`,
  `stg_google_play__stats_crashes_overview`, `stg_google_play__stats_installs_overview`,
  `stg_google_play__stats_ratings_overview`, and `stg_google_play__store_performance_source`
  models. Each model already returns this field; only the documentation was missing
  it.
- Removes the `android_os_version` field from the documentation for the `google_play__overview_report`
  model. This model does not return the field, so dbt raised a warning for it on every
  run.
